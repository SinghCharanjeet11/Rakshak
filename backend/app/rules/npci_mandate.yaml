# Rakshak rule-pack — NPCI UPI Autopay / e-mandate + RBI conduct guidelines
#
# NON-PRIMARY pack (no `circular:` key): merges into every primary rule-pack version.
#
# OPEN-2 status for this file, as of 2026-09-02: the two numeric values below were
# researched against multiple consistent secondary sources but NOT read in the primary
# NPCI circular or the RBI Fair Practices Code themselves. Both were corrected as a
# result, and both deliberately remain `value_verified: false` — a corrected number from
# secondary sourcing is better than a wrong one, but it is not verification, and this
# tool's credibility rests on not blurring the two.

version: "2026.1"
source: "NPCI UPI Autopay / e-mandate guidelines"

rules:
  # CORRECTED 2026-09-02. Was `max: 3`, which flagged the 4th attempt as a breach.
  #
  # NPCI's UPI Autopay rules effective 1 August 2025 permit a maximum of FOUR attempts
  # per mandate — one original execution plus three retries — after which the mandate is
  # auto-cancelled. `retry_index` counts *attempts* (see the field description in
  # llm/ingestion_agent.py and the Razorpay adapter's `attempts` mapping), so attempt 4
  # is the third retry and is permitted; attempt 5 is the first breach.
  #
  # This is not an RBI rule and must not cite the e-mandate circular: RBI/DPSS/2026-27/396
  # contains no retry or velocity limit at all, despite §8 being titled "Transaction
  # limits and velocity check".
  - id: RETRY_CAP_PER_WINDOW
    title: "Mandate attempts must not exceed 4 per window (1 original + 3 retries)"
    applies_to: [mandate_retry]
    severity: high
    clause: >-
      NPCI, Guidelines on usage of UPI and API (notified 2025-05-21, enforced 2025-08-01)
    clause_text: >-
      INSTRUMENT IDENTIFIED, WORDING NOT QUOTED. The limit is set by NPCI's "Guidelines on
      usage of Unified Payments Interface (UPI) and Application Programming Interface
      (API)", notified 21 May 2025 with enforcement from 1 August 2025: one original
      execution plus up to three retries per mandate sequence number, four attempts in
      total. NPCI does not publish this circular openly, so the number is corroborated
      across independent sources rather than read verbatim. Quote it and set
      value_verified once a copy of the circular itself is obtained.
    value_verified: false
    condition:
      kind: max_value
      field: retry_index
      max: 4

  # DOWNGRADED 2026-09-02. Previously `value_verified: true` while citing the placeholder
  # string "NPCI mandate + dispute handling", which pointed at no readable document.
  #
  # RBI/DPSS/2026-27/396 §9 was checked directly and does NOT support this rule. §9 requires
  # issuers to run a dispute *redressal* system and extends RBI's unauthorised-transaction
  # liability rules to e-mandates; it says nothing about suspending collection while a
  # dispute is open. The rule is sound operational conduct and is retained, but it is an
  # industry norm here, not a cited regulatory requirement, and the flag now says so.
  - id: NO_RETRY_UNDER_DISPUTE
    title: "Do not retry a payment under active dispute"
    applies_to: [mandate_retry, debit]
    severity: critical
    clause: "Operational norm — dispute handling (no primary source located)"
    clause_text: >-
      NOT QUOTED FROM THE PRIMARY SOURCE. RBI/DPSS/2026-27/396 §9 covers dispute redressal
      and customer liability for unauthorised transactions, and does not prohibit retrying
      a payment while a dispute is open. This rule encodes standard collections practice.
      Locate a chargeback or dispute-handling rule that mandates it, or keep it flagged.
    value_verified: false
    condition:
      kind: flag_must_be_false
      field: dispute_active

  # DOWNGRADED 2026-09-02. Previously `value_verified: true` citing the placeholder "consent
  # / DND", which named no document at all.
  #
  # RBI/DPSS/2026-27/396 §6(c) does grant an opt-out right, but of "any particular
  # transaction or the e-mandate" — i.e. opting out of a *debit*. This rule governs
  # *contact and notification*, which is TRAI's unsolicited-communication territory and the
  # Fair Practices Code, not the e-mandate circular. Citing §6(c) here would be exactly the
  # kind of over-claim the verified flag exists to prevent.
  #
  # NOTE: §6(c) would support a genuinely cited *separate* rule — do not debit after the
  # customer opted out of that transaction. That is worth adding; it is not this rule.
  - id: RESPECT_OPT_OUT
    title: "Do not contact a customer who has opted out"
    applies_to: [contact, notify]
    severity: high
    clause: "Customer consent / DND — TRAI UCC regulations and RBI Fair Practices Code"
    clause_text: >-
      NOT QUOTED FROM THE PRIMARY SOURCE. Contact consent is governed by TRAI's
      unsolicited-commercial-communication regulations and the RBI Fair Practices Code, not
      by RBI/DPSS/2026-27/396. Neither was read in primary form. §6(c) of the circular
      grants an opt-out from a transaction or mandate, which is a different obligation.
    value_verified: false
    condition:
      kind: flag_must_be_false
      field: consent_opted_out

  # CORRECTED 2026-09-02. Was 09:00–21:00, which was wrong at BOTH ends: it let a 20:00
  # call pass that should fail, and failed an 08:30 call that should pass.
  #
  # VERIFIED 2026-09-05. The primary instrument was located and read: RBI/2022-23/108
  # (DOR.ORG.REC.65/21.04.158/2022-23), "Outsourcing of Financial Services — Responsibilities
  # of regulated entities employing Recovery Agents", 12 August 2022. Paragraph 2 lists
  # prohibited practices and names the window verbatim, confirming 08:00–19:00 at both ends.
  #
  # `source` is set on the rule rather than inherited from this pack: the obligation is
  # RBI's, not NPCI's, and the rule only lives in this file because that is where conduct
  # rules are maintained. Stamping the pack's NPCI label on it would misattribute the law.
  #
  # Distinct from, and not to be confused with, NPCI's separate restriction on Autopay
  # *execution* windows (before 10:00, 13:00–17:00, after 21:30) — that governs when a
  # debit may be processed, not when a human may be contacted, and is not encoded here.
  - id: QUIET_HOURS
    title: "No customer contact outside 08:00–19:00 IST"
    applies_to: [contact]
    severity: medium
    source: "RBI — Responsibilities of regulated entities employing Recovery Agents (2022)"
    clause: "RBI/2022-23/108 ¶2 (DOR.ORG.REC.65/21.04.158/2022-23, 12 August 2022)"
    clause_text: >-
      [Regulated entities shall ensure that their agents do not resort to] persistently
      calling the borrower and/ or calling the borrower before 8:00 a.m. and after 7:00
      p.m. for recovery of overdue loans.
    value_verified: true
    verified_on: "2026-09-05"
    verified_against: "https://www.rbi.org.in/scripts/NotificationUser.aspx?Id=12378&Mode=0"
    condition:
      kind: timestamp_hour_between
      field: timestamp
      start_hour: 8
      end_hour: 19
